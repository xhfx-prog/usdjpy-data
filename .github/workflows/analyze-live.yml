name: Recompute USDJPY Python analysis from MCP live bars

on:
  push:
    branches: [main]
    paths:
      - 'control/live_analysis_request.json'

permissions:
  contents: write

concurrency:
  group: usdjpy-python-live-analysis
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regression-test existing Python analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate and recompute using existing Python analyzer
        id: analyze
        run: python analyze_live_request.py

      - name: Record request-bound Python analysis status
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          request_file=Path("control/live_analysis_request.json")
          request=json.loads(request_file.read_text()) if request_file.exists() else {}
          output_file=Path("data/analysis_live_latest.json")
          output=json.loads(output_file.read_text()) if output_file.exists() else {}
          success=(os.environ["ANALYSIS_OUTCOME"]=="success"
                   and output.get("request_id")==request.get("request_id")
                   and output.get("recomputed_from_live_1min") is True)
          result={
            "recorded_at_utc":datetime.now(timezone.utc).isoformat(),
            "request_id":request.get("request_id"),
            "event":os.environ.get("GITHUB_EVENT_NAME"),
            "run_id":os.environ.get("GITHUB_RUN_ID"),
            "run_url":"https://github.com/"+os.environ.get("GITHUB_REPOSITORY","")+
                      "/actions/runs/"+os.environ.get("GITHUB_RUN_ID",""),
            "analysis_outcome":os.environ["ANALYSIS_OUTCOME"],
            "matched_output":success,
            "strict_freshness_ok_at_compute":output.get("strict_freshness_ok_at_compute") if success else False,
            "input_live_fetched_at":output.get("input_live_fetched_at") if success else None,
            "analysis_generated_at_utc":output.get("analysis",{}).get("generated_at_utc") if success else None,
            "last_confirmed_1min_start_jst":output.get("last_confirmed_1min_start_jst") if success else None
          }
          Path("data/analysis_live_status.json").write_text(
            json.dumps(result,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Publish report and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis_live_status.json
          if [ -f data/analysis_live_latest.json ]; then
            git add data/analysis_live_latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record on-demand USDJPY Python analysis outcome"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
