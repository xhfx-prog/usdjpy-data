name: Archive morning USDJPY reports
on:
  push:
    branches: [main]
    paths: [archive_report.py, .github/workflows/archive-report.yml]
  schedule:
    - cron: '0 21 * * 0-4'
    - cron: '0 0 * * 1-5'
permissions:
  contents: write
concurrency:
  group: morning-report-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate archive script
        run: python -m py_compile archive_report.py
      - run: python archive_report.py
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
      - if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data/report_snapshots ]; then
            echo "No report snapshot was produced"
            exit 0
          fi
          git add data/report_snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive morning USDJPY report"
          git pull --rebase origin main
          git push origin HEAD:main
