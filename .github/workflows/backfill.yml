name: One-time USDJPY historical backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usdjpy-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backfill 1-minute OHLC once
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: python backfill_usdjpy.py
      - name: Publish history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_1min/ data/history_1min_index.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill historical 1-minute OHLC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
