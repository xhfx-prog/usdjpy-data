name: CME yen futures daily
# Quarantined: CME returns HTTP 403; manual authorized-feed validation only.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cme-jpy-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF parser
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Collect and validate
        env:
          CME_BULLETIN_AUTHORIZED_URL: ${{ secrets.CME_BULLETIN_AUTHORIZED_URL }}
        run: python3 scripts/collect_cme_jpy.py
      - name: Persist changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cme_jpy_daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update CME yen futures daily data'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
