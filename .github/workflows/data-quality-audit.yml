name: Offline data quality audit
on:
  push:
    paths:
      - 'scripts/audit_data_quality.py'
      - 'tests/**'
      - 'scripts/merge_publish.py'
      - 'scripts/collect_fx_intraday.py'
      - 'economic_calendar.py'
      - 'investigate_world_news.py'
      - 'analyze_usdjpy.py'
      - '.github/workflows/data-quality-audit.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Update USDJPY Data', 'Collect TFX USDJPY statistics']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '50 20,23 * * *'
permissions:
  contents: read
concurrency:
  group: offline-data-quality
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Collect TFX USDJPY statistics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run offline analysis and data quality regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate saved datasets
        if: always()
        env:
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$TRIGGER_WORKFLOW" = 'Collect TFX USDJPY statistics' ]; then
            python3 scripts/audit_data_quality.py --require-tfx
          else
            python3 scripts/audit_data_quality.py
          fi
      - name: Upload detailed audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-audit
          path: /tmp/usdjpy_quality_audit.json
          if-no-files-found: error
