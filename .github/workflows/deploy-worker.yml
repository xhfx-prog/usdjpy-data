name: Deploy USDJPY MCP Worker (source change or guarded manual)

on:
  push:
    branches:
      - main
    paths:
      - 'control/deploy_worker_request.json'
      - 'cloudflare/worker.js'
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_USDJPY_CHART to authorize deployment"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: usdjpy-cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirmation == 'DEPLOY_USDJPY_CHART' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Classify push trigger
        id: classify
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          before=os.environ.get("BEFORE_SHA", "")
          if not before or set(before)=={"0"}:
              print("Cannot verify previous commit; refusing auto deploy")
              raise SystemExit(1)
          subprocess.run(["git","fetch","--no-tags","--depth=2","origin",before],check=True)
          changed=subprocess.check_output(["git","diff","--name-only",before,"HEAD"],text=True).splitlines()
          source="cloudflare/worker.js" in changed
          request="control/deploy_worker_request.json" in changed
          if not source and not request:
              raise SystemExit("No Worker source or deploy request diff; refusing deployment")
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("source_changed="+str(source).lower()+"\n")
              output.write("request_changed="+str(request).lower()+"\n")
          print("Source changed:",source,"Manual request:",request)
          PY

      - name: Validate on-demand deployment request
        if: github.event_name == 'push' && steps.classify.outputs.source_changed != 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          request = json.loads(Path("control/deploy_worker_request.json").read_text(encoding="utf-8"))
          actual = subprocess.check_output(["git","hash-object","cloudflare/worker.js"],text=True).strip()
          assert request.get("confirmation") == "DEPLOY_USDJPY_CHART", "Confirmation missing"
          assert request.get("expected_worker_blob_sha") == actual, "Worker source changed since authorization"
          print("Approved deployment for Worker blob SHA:", actual)
          PY

      - name: Check Worker source and credentials
        working-directory: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -s worker.js || { echo 'Worker source not yet imported; refusing to deploy.'; exit 1; }
          test -n "$CF_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Check JavaScript syntax
        run: node --check cloudflare/worker.js

      - name: Test MCP and Python analysis reconciliation
        run: node --test tests/worker_analysis_integration.test.mjs

      - name: Deploy existing Worker
        id: worker_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --keep-vars

      - name: Validate deployed MCP endpoint
        id: verify_mcp
        run: |
          set -eu
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            'https://usdjpy-chart.xxhappyfrenzyxx.workers.dev/mcp' \
            | python -c 'import json,sys; r=json.load(sys.stdin); names={t["name"] for t in r["result"]["tools"]}; assert {"get_usdjpy_analysis","get_usdjpy_bundle","get_latest_usdjpy","get_usdjpy_history"} <= names, names; print("MCP tools verified:", ", ".join(sorted(names)))'

      - name: Publish deployment audit to GitHub
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.worker_deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_mcp.outcome }}
          JOB_STATE: ${{ job.status }}
          REQUEST_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          request_file = Path("control/deploy_worker_request.json")
          request = json.loads(request_file.read_text()) if request_file.exists() else {}
          audit = {
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": "https://github.com/" + os.environ.get("GITHUB_REPOSITORY", "") + "/actions/runs/" + os.environ.get("GITHUB_RUN_ID", ""),
              "event": os.environ["REQUEST_EVENT"],
              "request_sequence": request.get("sequence"),
              "expected_worker_blob_sha": request.get("expected_worker_blob_sha"),
              "deploy_outcome": os.environ["DEPLOY_OUTCOME"],
              "mcp_verification_outcome": os.environ["VERIFY_OUTCOME"],
              "job_state_before_audit": os.environ["JOB_STATE"],
          }
          Path("data/deploy_worker_status.json").write_text(json.dumps(audit, indent=2) + "\n", encoding="utf-8")
          print("Audit status:", audit["deploy_outcome"], audit["mcp_verification_outcome"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deploy_worker_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Cloudflare Worker deployment status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
