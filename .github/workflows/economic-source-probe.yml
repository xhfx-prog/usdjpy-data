name: Economic source probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_economic_sources.py'
      - '.github/workflows/economic-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/probe_economic_sources.py
      - run: python scripts/probe_economic_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: economic-source-probe
          path: data/economic_source_probe.json
          if-no-files-found: error
