name: FX public flow sources
on:
  push:
    paths:
      - 'scripts/collect_fx_flow_sources.py'
      - '.github/workflows/fx-flow-sources.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 20,23 * * 1-6'
permissions:
  contents: write
concurrency:
  group: fx-flow-sources
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_fx_flow_sources.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fx_flow_sources.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update FX public flow source index'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
