name: FX cross-market intraday
on:
  push:
    paths:
      - 'scripts/collect_fx_intraday.py'
      - '.github/workflows/fx-intraday.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
permissions:
  contents: write
concurrency:
  group: fx-intraday
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_fx_intraday.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fx_intraday.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update delayed FX cross-market data'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
