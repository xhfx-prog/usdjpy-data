name: FX cross-market intraday
on:
  push:
    paths:
      - 'scripts/collect_fx_intraday.py'
      - '.github/workflows/fx-intraday.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
permissions:
  contents: write
concurrency:
  group: fx-intraday
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_fx_intraday.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/collector-snapshot
          cp data/fx_intraday.json /tmp/collector-snapshot/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/merge_publish.py /tmp/collector-snapshot data
            git add data/fx_intraday.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update delayed FX cross-market data'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
