name: Historical USDJPY as-of analysis replay

on:
  push:
    branches: [main]
    paths:
      - 'control/historical_analysis_request.json'

permissions:
  contents: write

concurrency:
  group: usdjpy-asof-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical Python analysis at specified past time
        id: analyze
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from datetime import datetime
          from pathlib import Path
          r=json.loads(Path("control/historical_analysis_request.json").read_text())
          if r.get("as_of_jst")!="2026-11-05T06:00:00+09:00":
              raise SystemExit("Unexpected replay date")
          path="data/analysis_asof_20261105_0600.json"
          subprocess.run([sys.executable,"analyze_usdjpy.py","--as-of",r["as_of_jst"],"--out",path],check=True)
          obj=json.loads(Path(path).read_text())
          assert obj["analysis_asof_jst"]=="2026-11-05T06:00:00+09:00"
          assert obj["data_quality"]["last_confirmed_1min_start_jst"]<"2026-11-05 06:00:00"
          print(json.dumps({"asof":obj["analysis_asof_jst"],
                            "last":obj["data_quality"]["last_confirmed_1min_start_jst"],
                            "phase":obj["market_structure"]["phase"]}))
          PY
      - name: Publish replay report and status
        if: always()
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          o={"recorded_at_utc":datetime.now(timezone.utc).isoformat(),
             "run_id":os.environ["GITHUB_RUN_ID"],
             "outcome":os.environ["OUTCOME"],
             "request":"2026-11-05T06:00:00+09:00"}
          Path("data/historical_analysis_status.json").write_text(json.dumps(o,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_analysis_status.json
          if [ -f data/analysis_asof_20261105_0600.json ]; then
            git add data/analysis_asof_20261105_0600.json
          fi
          git commit -m "Record November 5 06:00 JST historical Python replay"
          git pull --rebase origin main
          git push origin HEAD:main
