name: Historical USDJPY as-of analysis replay

on:
  push:
    branches: [main]
    paths:
      - 'control/historical_analysis_request.json'

permissions:
  contents: write

concurrency:
  group: usdjpy-asof-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical Python analysis at specified past time
        id: analyze
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from datetime import datetime
          from pathlib import Path
          r=json.loads(Path("control/historical_analysis_request.json").read_text())
          targets=r.get("cutoffs_jst") or [r["as_of_jst"]]
          for ts in targets:
              asof=datetime.fromisoformat(ts)
              if asof.utcoffset().total_seconds()!=9*3600:
                  raise SystemExit("Replay requires JST offset +09:00")
              if not ("2026-11-02"<=asof.strftime("%Y-%m-%d")<="2026-11-06"):
                  raise SystemExit("Replay date outside audited historical archive")
              suffix=asof.strftime("%Y%m%d_%H%M")
              path=f"data/analysis_asof_{suffix}.json"
              subprocess.run([sys.executable,"analyze_usdjpy.py","--as-of",ts,"--out",path],check=True)
              obj=json.loads(Path(path).read_text())
              assert datetime.fromisoformat(obj["analysis_asof_jst"])==asof
              assert obj["data_quality"]["last_confirmed_1min_start_jst"]<asof.strftime("%Y-%m-%d %H:%M:%S")
              print(json.dumps({"asof":obj["analysis_asof_jst"],
                                "last":obj["data_quality"]["last_confirmed_1min_start_jst"],
                                "phase":obj["market_structure"]["phase"],
                                "geometry4h":obj["market_structure"]["higher_timeframe_chart_context"]["4h"]["pattern"],
                                "structure4h":obj["market_structure"]["higher_timeframe_chart_context"]["4h"]["structure"]}))
          PY
      - name: Publish replay report and status
        if: always()
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          o={"recorded_at_utc":datetime.now(timezone.utc).isoformat(),
             "run_id":os.environ["GITHUB_RUN_ID"],
             "outcome":os.environ["OUTCOME"],
             "request":json.loads(Path("control/historical_analysis_request.json").read_text())["as_of_jst"]}
          Path("data/historical_analysis_status.json").write_text(json.dumps(o,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_analysis_status.json
          git add data/analysis_asof_20261105_*.json data/analysis_asof_20261106_*.json
          git commit -m "Record November 5 historical Python as-of replay"
          git pull --rebase origin main
          git push origin HEAD:main
