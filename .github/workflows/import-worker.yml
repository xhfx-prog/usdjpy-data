name: Import deployed USDJPY Worker source (no deploy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/import_worker_request.json'

permissions:
  contents: write

concurrency:
  group: usdjpy-import-worker-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download currently deployed Worker (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -D /tmp/usdjpy-worker.headers \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/usdjpy-chart/content/v2" \
            -o /tmp/usdjpy-worker.body
          python - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          raw = Path("/tmp/usdjpy-worker.body").read_bytes()
          headers = Path("/tmp/usdjpy-worker.headers").read_text(errors="replace")
          content_type = next((ln.split(":", 1)[1].strip() for ln in headers.splitlines() if ln.lower().startswith("content-type:")), "")
          if content_type.lower().startswith("multipart/"):
              message = BytesParser(policy=default).parsebytes(
                  ("MIME-Version: 1.0\r\nContent-Type: " + content_type + "\r\n\r\n").encode() + raw
              )
              parts = [p for p in message.walk() if not p.is_multipart()]
              ranked = sorted(parts, key=lambda p: (
                  0 if p.get_filename() == "worker.js" else
                  1 if p.get_content_type() in ("application/javascript", "text/javascript") else 2
              ))
              candidates = [p.get_payload(decode=True) for p in ranked]
          else:
              candidates = [raw]
          picked = next((c for c in candidates if c and b"export default" in c and b"get_usdjpy_bundle" in c and b"get_usdjpy_history" in c), None)
          if picked is None:
              raise SystemExit("The downloaded response did not contain the expected v4 Worker module. No changes made.")
          source = picked.decode("utf-8")
          if "TWELVE_API_KEY" not in source:
              raise SystemExit("Expected secret binding not present; refusing to import unexpected code.")
          if len(source) > 200000:
              raise SystemExit("Unexpectedly large Worker source")
          out = Path("cloudflare/worker.js")
          out.parent.mkdir(exist_ok=True)
          out.write_text(source.rstrip() + "\n", encoding="utf-8")
          print("Source fetched; bytes:", len(picked))
          PY

      - name: Validate imported module (no deploy)
        run: |
          node --check cloudflare/worker.js
          grep -q 'get_usdjpy_bundle' cloudflare/worker.js
          grep -q 'get_usdjpy_history' cloudflare/worker.js
          grep -q 'get_latest_usdjpy' cloudflare/worker.js

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Import currently deployed USDJPY Worker source (no deploy)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
