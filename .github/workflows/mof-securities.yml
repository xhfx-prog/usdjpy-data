name: MOF securities weekly
on:
  push:
    paths:
      - 'scripts/collect_mof_securities.py'
      - '.github/workflows/mof-securities.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 1 * * 1-5'
permissions:
  contents: write
concurrency:
  group: mof-securities
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_mof_securities.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mof_securities_weekly.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive MOF weekly securities statistics'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
