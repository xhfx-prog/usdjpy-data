name: Scheduled macro evidence
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scheduled_macro.py', '.github/workflows/scheduled-macro.yml']
permissions:
  contents: write
concurrency:
  group: scheduled-macro
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_world_news.py' -v
      - run: python scheduled_macro.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish scheduled macro evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
