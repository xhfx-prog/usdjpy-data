name: Smoke-test production USDJPY analysis MCP

on:
  push:
    branches: [main]
    paths:
      - 'control/smoke_mcp_analysis_request.json'
      - 'tests/smoke_mcp_integration.py'
      - '.github/workflows/smoke-mcp-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify production MCP analysis tool
        id: verify
        run: python tests/smoke_mcp_integration.py
      - name: Publish smoke status
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path("data/mcp_integration_smoke_status.json")
          if os.environ["VERIFY_OUTCOME"] != "success":
              path.write_text(json.dumps({"tested_at_utc":datetime.now(timezone.utc).isoformat(),"status":"FAIL","workflow_run_id":os.environ.get("GITHUB_RUN_ID"),"reason":"Inspect GitHub Actions step logs"},indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/mcp_integration_smoke_status.json /tmp/mcp-smoke.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/mcp_integration_smoke_status.json")
          new=json.loads(Path("/tmp/mcp-smoke.json").read_text())
          old=json.loads(p.read_text()) if p.exists() else {}
          if new.get("tested_at_utc","") >= old.get("tested_at_utc",""):
              p.write_text(json.dumps(new,indent=2)+"\n")
          PY
            git add data/mcp_integration_smoke_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record production USDJPY analysis MCP smoke test"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
