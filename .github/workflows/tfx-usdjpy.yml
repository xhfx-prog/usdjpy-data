name: Collect TFX USDJPY statistics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_tfx.py'
      - 'scripts/position_statistics.py'
      - '.github/workflows/tfx-usdjpy.yml'
  schedule:
    # JST 07:35, 08:35, 10:35, 12:35, 16:35 and 21:35.
    - cron: '35 22,23,1,3,7,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tfx-usdjpy-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel reader
        run: python -m pip install 'xlrd==2.0.1'
      - name: Collect official data and validate before saving
        run: python scripts/collect_tfx.py
      - name: Publish verified data or explicit fallback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tfx_usdjpy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish TFX USDJPY daily and weekly statistics'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Flag source or validation failures after publishing fallback
        run: |
          python - <<'PY'
          from scripts.collect_tfx import OUT, SERIES, load_json
          snapshot = load_json(OUT)
          for name in SERIES:
              print(name, snapshot[name]["status"], snapshot[name]["errors"])
          raise SystemExit(any(snapshot[name]["status"] != "SOURCE_VERIFIED" for name in SERIES))
          PY
