name: Update USDJPY Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'control/refresh_request.json'
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: usdjpy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Record runner start timestamp
        run: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/usdjpy_runner_started_utc

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch USDJPY candles
        id: fetch
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: python fetch_usdjpy.py

      - name: Run analyzer regression tests
        if: steps.fetch.outcome == 'success'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate deterministic USDJPY analysis
        id: analyze
        if: steps.fetch.outcome == 'success'
        run: python analyze_usdjpy.py

      - name: Record run diagnostics
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          JOB_STATUS: ${{ job.status }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p = Path('data/workflow_status.json')
          now = datetime.now(timezone.utc)
          start_path = Path('/tmp/usdjpy_runner_started_utc')
          started = start_path.read_text().strip() if start_path.exists() else None
          started_at = datetime.fromisoformat(started.replace('Z','+00:00')) if started else None
          # The theoretical slot is an estimate, NOT the actual scheduled event timestamp.
          schedule_minutes = (11,)
          slot = (started_at or now).replace(second=0, microsecond=0)
          while slot.minute not in schedule_minutes:
              slot -= timedelta(minutes=1)
          event = {
              'runner_started_at_utc': started,
              'estimated_previous_cron_slot_utc': slot.isoformat() if os.getenv('GITHUB_EVENT_NAME') == 'schedule' else None,
              'runner_start_delay_from_estimated_slot_seconds': round((started_at-slot).total_seconds(),1) if started_at and os.getenv('GITHUB_EVENT_NAME') == 'schedule' else None,
              'schedule_expression': os.getenv('SCHEDULE_EXPRESSION') or None,
              'refresh_request_id': (json.loads(Path('control/refresh_request.json').read_text(encoding='utf-8')).get('request_id') if Path('control/refresh_request.json').exists() else None),
              'actual_scheduled_slot_known': False,
              'delay_is_lower_bound_only': True,
              'recorded_at_utc': now.isoformat(),
              'event': os.getenv('GITHUB_EVENT_NAME'),
              'run_id': os.getenv('GITHUB_RUN_ID'),
              'run_attempt': os.getenv('GITHUB_RUN_ATTEMPT'),
              'fetch_outcome': os.getenv('FETCH_OUTCOME'),
              'job_status_before_publish': os.getenv('JOB_STATUS'),
              'sha': os.getenv('GITHUB_SHA'),
          }
          previous = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          history = previous.get('recent_runs', [])
          history = [h for h in history if not (h.get('run_id') == event['run_id'] and h.get('run_attempt') == event['run_attempt'])]
          history.append(event)
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'latest':event, 'recent_runs':history[-100:]}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Audit GitHub Actions run history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('data/workflow_runs_audit.json')
          audit = {
              'audited_at_utc': datetime.now(timezone.utc).isoformat(),
              'source': 'GitHub REST API /actions/workflows/update.yml/runs',
              'note': 'Run created_at is NOT the intended cron slot; a missing slot may reflect skipped scheduling.',
          }
          try:
              repo = os.environ['GH_REPOSITORY']
              url = f'https://api.github.com/repos/{repo}/actions/workflows/update.yml/runs?per_page=100&branch=main'
              req = urllib.request.Request(url, headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'USDJPY-Data-Collector'
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  obj = json.load(response)
              audit['total_count'] = obj.get('total_count')
              audit['recent_runs'] = [{
                  k: run.get(k) for k in
                  ('id','event','status','conclusion','created_at','run_started_at',
                   'updated_at','run_attempt','html_url','head_sha')
              } for run in obj.get('workflow_runs',[])]
              audit['status'] = 'success'
          except Exception as exc:
              audit['status'] = 'error'
              audit['error'] = str(exc)
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(audit, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(f"Run-history audit: {audit['status']}; entries: {len(audit.get('recent_runs', []))}")
          PY

      - name: Publish data and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update USDJPY market data and run diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
