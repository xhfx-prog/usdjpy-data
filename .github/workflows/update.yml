name: Update USDJPY Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: usdjpy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch USDJPY candles
        id: fetch
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: python fetch_usdjpy.py

      - name: Record run diagnostics
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('data/workflow_status.json')
          event = {
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'event': os.getenv('GITHUB_EVENT_NAME'),
              'run_id': os.getenv('GITHUB_RUN_ID'),
              'run_attempt': os.getenv('GITHUB_RUN_ATTEMPT'),
              'fetch_outcome': os.getenv('FETCH_OUTCOME'),
              'job_status_before_publish': os.getenv('JOB_STATUS'),
              'sha': os.getenv('GITHUB_SHA'),
          }
          previous = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          history = previous.get('recent_runs', [])
          history.append(event)
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'latest':event, 'recent_runs':history[-100:]}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Publish data and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update USDJPY market data and run diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
